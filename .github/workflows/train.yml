name: Train, test & publish model

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "tools/**"
      - "requirements*.txt"
      - "data/**"
      - "notebooks/**"
      - "Dockerfile.*"
      - "docker-compose.yml"
      - ".github/workflows/train.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A second push queues behind the first instead of killing it mid-way
  # (cancel-in-progress previously caused an unrelated "operation was canceled").
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Every step pipes into tee with `set -euo pipefail` and `2>&1`: without
      # pipefail a crashing script still reports success (tee exits 0), and
      # without 2>&1 its traceback never reaches the log.
      - name: CNC / machine tool (AI4I2020)
        run: |
          set -euo pipefail
          python train.py 2>&1 | tee reports-train.log
          python predict.py

      - name: Gas turbine walk-forward backtest (NASA C-MAPSS)
        run: |
          set -euo pipefail
          python backtest.py 2>&1 | tee reports-backtest.log

      - name: Rotating equipment / bearings (Univ. of Ottawa, leave-bearings-out)
        run: |
          set -euo pipefail
          python train_bearing.py 2>&1 | tee reports-bearing.log

      - name: Wind turbine / generator (real SCADA)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python train_wind_turbine.py 2>&1 | tee reports-wind-turbine.log

      - name: HVAC rooftop unit (LBNL/ORNL experimental, leave-one-season-out)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python train_hvac.py 2>&1 | tee reports-hvac.log

      - name: Robotic arm (UR3 CobotOps, chronological walk-forward)
        run: |
          set -euo pipefail
          python train_robot.py 2>&1 | tee reports-robot.log

      - name: Conveyor drive (KAIST vibration, leave-one-load-out)
        run: |
          set -euo pipefail
          python train_conveyor.py 2>&1 | tee reports-conveyor.log

      - name: Tests (leakage guards, feature causality, backend API, headless app)
        run: |
          set -euo pipefail
          python -m pytest -v 2>&1 | tee reports-pytest.log

      - name: Execute notebook
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/01_eda_modeling.ipynb

      - name: Job summary
        # Informational only -- must never fail the job.
        if: always()
        continue-on-error: true
        run: |
          for f in reports/results.md reports/backtest_results.md reports/bearing_results.md \
                   reports/wind_turbine_results.md reports/hvac_results.md \
                   reports/robot_results.md reports/conveyor_results.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "warning: $f missing"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            reports-*.log

      # Handed to the docker-smoke-test job, which runs on its own fresh runner.
      - name: Package trained models for the Docker smoke test
        run: |
          set -euo pipefail
          mkdir -p _artifact_payload
          for f in predictive_maintenance_model.pkl feature_names.pkl model_meta.json \
                   backtest_model.pkl turbine_meta.pkl \
                   bearing_model.pkl bearing_type_model.pkl bearing_meta.pkl \
                   wind_turbine_model.pkl wind_turbine_meta.pkl \
                   hvac_model.pkl hvac_diag_model.pkl hvac_meta.pkl \
                   robot_model.pkl robot_meta.pkl \
                   conveyor_model.pkl conveyor_meta.pkl; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing -- the training step that should produce it did not."
              exit 1
            fi
            cp "$f" _artifact_payload/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: _artifact_payload/

      - name: Commit trained models, reports, and data caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            predictive_maintenance_model.pkl feature_names.pkl model_meta.json \
            backtest_model.pkl turbine_meta.pkl \
            bearing_model.pkl bearing_type_model.pkl bearing_meta.pkl \
            wind_turbine_model.pkl wind_turbine_meta.pkl \
            hvac_model.pkl hvac_diag_model.pkl hvac_meta.pkl \
            robot_model.pkl robot_meta.pkl \
            conveyor_model.pkl conveyor_meta.pkl \
            reports/ notebooks/ \
            data/cmapss_train_FD001.csv data/wind_turbine_subsample.csv.gz \
            data/hvac_ornl_rtu.csv.gz data/robot_ur3_cobotops.csv.gz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update trained models and reports [skip ci]"
            git pull --rebase
            git push
          fi

      # Runs if ANY step above failed. The raw log viewer and artifact
      # downloads need a signed-in session even on a public repo; a committed
      # file is readable by anyone with `git pull`.
      - name: On failure, commit logs so the error is readable without signing in
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -q
          mkdir -p ci-debug
          cp reports-*.log ci-debug/ 2>/dev/null || true
          echo "Run: $GITHUB_RUN_ID  Commit: $GITHUB_SHA  $(date -u)" > ci-debug/run-info.txt
          git add -f ci-debug/
          git commit -m "CI debug logs from failed run $GITHUB_RUN_ID [skip ci]" || true
          git pull --rebase || true
          git push || true

  docker-smoke-test:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: .

      - name: Build and start the downloadable Docker stack
        run: docker compose up -d --build

      - name: Score a machine of EVERY type through the running stack
        run: |
          set -euo pipefail
          python3 tools/smoke_test.py http://localhost:8000 2>&1 | tee smoke.log
          curl -sf http://localhost:8501 > /dev/null && echo "Frontend responding"

      - name: Container logs
        if: always()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
